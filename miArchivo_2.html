<!DOCTYPE html>
<html>
<head>
    <title>Clase antes de vacaciones</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body style="color:bisque;">

  <div id="encabezado"> 
    <h2>Encabezado</h2>
  </div>

  <div id="contenedor">
    <div class="elemento"> Sección 1</div>
    <div class="elemento"> Sección 2</div>
    <div class="elemento"> Sección 3</div>    
  </div> 

  <div id="cuerpo"></div>

  <button type="button" id="uno">Mostrar libro</button>

  <button type="button" id="dos">
    Mostrar mi artista favorito
  </button>

  <button type="button" id="tres">
    Mostrar artista favorito de Carlos
  </button>

<script>

  let t = 1986;
  console.log(t);

  const c = 12;

  let p = {
    "titulo":"Llano en llamas",
    "autor":"Juan Rulfo"
  };

  console.log(p.autor);

  // funcion
  function tripicar(a){
    return 3*a;
  }

  // crear párrafo
  let d = document.createElement("p");
  d.textContent = "hola";

  document
    .getElementById("encabezado")
    .appendChild(d)
    .setAttribute("style","color:blue;");

  // traer datos json
  async function obtenerJSON(){

    const respuesta = await fetch('archivo.json');
    const datos = await respuesta.json();

    return datos;
  }

  async function mostrarDatos(){

    let datos = await obtenerJSON();

    let f = document.createElement("p");
    f.textContent = datos.autor;

    document
      .getElementById("cuerpo")
      .appendChild(f)
      .setAttribute("style","color:red;");
  }

  mostrarDatos();

  // mostrar libro automatico
  async function webJSON(){

    const respuesta = await fetch(
      "https://openlibrary.org/subjects/love.json?published_in=1500-1600"
    );

    const data = await respuesta.json();

    let r = document.createElement("p");

    r.textContent = data.works[0].title;

    document
      .getElementById("cuerpo")
      .appendChild(r)
      .setAttribute("style","color:red;");
  }

  webJSON();

  // mostrar otro libro con botón
  async function webJSON2(){

    const respuesta = await fetch(
      "https://openlibrary.org/subjects/love.json?published_in=1500-1600"
    );

    const data = await respuesta.json();

    let r = document.createElement("p");

    r.textContent = data.works[3].title;

    document
      .getElementById("cuerpo")
      .appendChild(r)
      .setAttribute("style","color:red;");
  }

  let d2 = document.getElementById("uno");

  d2.addEventListener("click", webJSON2);

  // MI ARTISTA FAVORITO (Bad Bunny)
  async function Artista(){

    let r = document.createElement("img");

    const respuesta = await fetch(
      "https://www.theaudiodb.com/api/v1/json/123/search.php?s=bad+bunny"
    );

    const data = await respuesta.json();

    r.src = data.artists[0].strArtistThumb;

    document.getElementById("cuerpo").appendChild(r);
  }

  let d3 = document.getElementById("dos");

  d3.addEventListener("click", Artista);

  // ARTISTA FAVORITO DE CARLOS (Peso Pluma)
  async function Artista2(){

    let r = document.createElement("img");

    const respuesta = await fetch(
      "https://www.theaudiodb.com/api/v1/json/123/search.php?s=peso+pluma"
    );

    const data = await respuesta.json();

    r.src = data.artists[0].strArtistThumb;

    document.getElementById("cuerpo").appendChild(r);
  }

  let d4 = document.getElementById("tres");

  d4.addEventListener("click", Artista2);

</script>

</body>
</html>
