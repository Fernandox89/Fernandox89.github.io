      async function irPorAlgo() {
        try {
          const respuesta = await fetch("https://api.thedogapi.com/v1/images/search?limit=1", {
            method: "GET",
            headers: {
              "x-api-key": "live_RC5pWb24eBaIDZBmp2mvada02POcGKX4BRBjkliRkxr5EjPhLkCKWz5T8sYG1beD"
            }
          });

          if (!respuesta.ok) {
            console.log("Error");
            //throw new Error("Error");
          }
          const data = await respuesta.json();
          const img = document.createElement("img");
          img.src = data[0].url;
          img.alt = "Imagen de perro";
          img.style.maxWidth = "100%";

          const imagenCont = document.getElementById("bio");
          imagenCont.innerHTML = "";
          imagenCont.appendChild(img);

          console.log(data);
        } catch (error) {
          console.error("Error:", error.message);
        }
      }

      async function votar() {
  try {
        const respuesta = await fetch("https://api.thedogapi.com/v1/votes",
        {

              headers: {

              },
              body: JSON.stringify({
              image_id: img.src.split("/").slice(-1)[0].split(".")[0], // Extrae el ID de la imagen del URL
              value: 1
        })

    if (!respuesta.ok) {
